<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W5ALC Pictures Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #000000 0%, #667 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .filter-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .filter-btn {
            padding: 10px 20px;
            background: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .filter-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .gallery-item {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            transition: all 0.3s;
            cursor: pointer;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.3);
        }

        .image-wrapper {
            width: 100%;
            height: 250px;
            overflow: hidden;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .gallery-item:hover img {
            transform: scale(1.1);
        }

        .item-info {
            padding: 15px;
            background: white;
        }

        .item-title {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            word-break: break-all;
        }

        .item-type {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            max-width: 90%;
            max-height: 90%;
            position: relative;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 10px;
            box-shadow: 0 0 50px rgba(255,255,255,0.3);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 40px;
            color: white;
            cursor: pointer;
            background: rgba(0,0,0,0.5);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .modal-close:hover {
            background: rgba(255,255,255,0.2);
            transform: rotate(90deg);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📡 W5ALC Pictures Gallery</h1>
            <p class="subtitle">Amateur Radio & Emergency Communications</p>
        </header>

        <div class="filter-controls">
            <button class="filter-btn active" data-filter="all">All Files</button>
            <button class="filter-btn" data-filter="ares">ARES</button>
            <button class="filter-btn" data-filter="license">Licenses</button>
            <button class="filter-btn" data-filter="weather">Weather/NWS</button>
            <button class="filter-btn" data-filter="equipment">Equipment</button>
            <button class="filter-btn" data-filter="other">Other</button>
        </div>

        <div class="gallery" id="gallery"></div>
    </div>

    <div class="modal" id="modal">
        <span class="modal-close" id="modalClose">&times;</span>
        <div class="modal-content">
            <img id="modalImg" src="" alt="">
        </div>
    </div>

    <script>
        const baseUrl = 'https://raw.githubusercontent.com/N5RR/Pictures/main/';
        
        const files = [
            { name: '20231216_142210.jpg', type: 'equipment' },
            { name: '20231216_142358.jpg', type: 'equipment' },
            { name: '20231216_142422.jpg', type: 'equipment' },
            { name: '20231216_145249.jpg', type: 'equipment' },
            { name: 'active-alert.png', type: 'weather' },
            { name: 'afd.png', type: 'weather' },
            { name: 'Ares-Pueblo-CO-Dark.png', type: 'ares' },
            { name: 'Ares-Pueblo-CO-Template.png', type: 'ares' },
            { name: 'Ares-Pueblo-CO-W5ALC.png', type: 'ares' },
            { name: 'Ares-Pueblo-CO.png', type: 'ares' },
            { name: 'Ares-Pueblo-CO4X6-Dark.png', type: 'ares' },
            { name: 'Ares-Pueblo-CO4X6.png', type: 'ares' },
            { name: 'Ares-Pueblo-TemplateCO-Template.png', type: 'ares' },
            { name: 'Ares-Pueblo.png', type: 'ares' },
            { name: 'CSWN-CO-Alert.png', type: 'weather' },
            { name: 'CSWN-GOES.png', type: 'weather' },
            { name: 'CSWN-HWO.png', type: 'weather' },
            { name: 'CSWN-Main.png', type: 'weather' },
            { name: 'CSWN-US-Alert.png', type: 'weather' },
            { name: 'excessive-rainfall.png', type: 'weather' },
            { name: 'Extra.jpg', type: 'license' },
            { name: 'FCC GenTel.jpg', type: 'license' },
            { name: 'FCC K6EID.jpg', type: 'license' },
            { name: 'FCC_Seal_2020.png', type: 'license' },
            { name: 'ft2500-mic.jpg', type: 'equipment' },
            { name: 'goes19.png', type: 'weather' },
            { name: 'hwo.png', type: 'weather' },
            { name: 'License-Template-Extra-map.png', type: 'license' },
            { name: 'License-Template-Extra.png', type: 'license' },
            { name: 'License-Template-General-map.png', type: 'license' },
            { name: 'License-Template-General.png', type: 'license' },
            { name: 'License-Template-Tech-map.png', type: 'license' },
            { name: 'License-Template-Tech.png', type: 'license' },
            { name: 'mesoscale-discussions.png', type: 'weather' },
            { name: 'motorola_hmn3000b.jpg', type: 'equipment' },
            { name: 'net-notary-c.png', type: 'other' },
            { name: 'net-notary-d.png', type: 'other' },
            { name: 'net-notary-new.gif', type: 'other' },
            { name: 'net-notary.gif', type: 'other' },
            { name: 'net-notary.png', type: 'other' },
            { name: 'node-cron.gif', type: 'other' },
            { name: 'nws-radar.png', type: 'weather' },
            { name: 'nws.jpg', type: 'weather' },
            { name: 'Pueblo-ARES-logo-1.jpg', type: 'ares' },
            { name: 'Pueblo-ARES-logo-22.jpg', type: 'ares' },
            { name: 'Pueblo-ARES-logo-US-CO-FLAG-1.jpg', type: 'ares' },
            { name: 'Pueblo-ARES-logo-US-CO-FLAG-420.jpg', type: 'ares' },
            { name: 'Pueblo-ARES-logo-US-CO-FLAG.jpg', type: 'ares' },
            { name: 'Pueblo-ARES-logo-US-CO-FLgreenAG.jpg', type: 'ares' },
            { name: 'Pueblo-ARES-logo.jpg', type: 'ares' },
            { name: 'Pueblo-Mountains-Big-Natural-Snow.png', type: 'other' },
            { name: 'rj45-1.jpg', type: 'equipment' },
            { name: 'Screenshot_20240324_223119.jpg', type: 'other' },
            { name: 'Screenshot_20240324_223216.jpg', type: 'other' },
            { name: 'Screenshot_20250630_140800-2.png', type: 'other' },
            { name: 'Screenshot_20250630_140800.png', type: 'other' },
            { name: 'Skywarn-cyan.png', type: 'weather' },
            { name: 'toolkit.png', type: 'other' },
            { name: 'Untitled.png', type: 'other' },
            { name: 'Untitled2.png', type: 'other' },
            { name: 'Untitled3.png', type: 'other' },
            { name: 'Untitledtemp.png', type: 'other' }
        ];

        const gallery = document.getElementById('gallery');
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modalImg');
        const modalClose = document.getElementById('modalClose');

        function renderGallery(filter = 'all') {
            gallery.innerHTML = '';
            
            const filteredFiles = filter === 'all' 
                ? files 
                : files.filter(f => f.type === filter);

            filteredFiles.forEach(file => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.innerHTML = `
                    <div class="image-wrapper">
                        <img src="${baseUrl}${encodeURIComponent(file.name)}" 
                             alt="${file.name}"
                             loading="lazy">
                    </div>
                    <div class="item-info">
                        <div class="item-title">${file.name}</div>
                        <div class="item-type">${file.type}</div>
                    </div>
                `;
                
                item.addEventListener('click', () => {
                    modalImg.src = baseUrl + encodeURIComponent(file.name);
                    modal.classList.add('active');
                });
                
                gallery.appendChild(item);
            });
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                renderGallery(e.target.dataset.filter);
            });
        });

        modalClose.addEventListener('click', () => {
            modal.classList.remove('active');
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('active');
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                modal.classList.remove('active');
            }
        });

        renderGallery();
    </script>
</body>
</html>
